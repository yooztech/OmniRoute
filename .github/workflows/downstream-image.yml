name: Downstream GHCR image
run-name: Downstream GHCR image / ${{ inputs.request_id || github.run_id }}

on:
  workflow_dispatch:
    # First publication is deliberately single-architecture so exactly the
    # locally smoke-tested image is pushed. image.mjs also supports multiarch.
    inputs:
      request_id:
        description: Unique publication request identifier (set by downstream/publish.mjs)
        required: true
        type: string
  pull_request:
    paths:
      - downstream/**
      - .github/workflows/downstream-*.yml
  push:
    branches: [main]
    paths:
      - downstream/**
      - .github/workflows/downstream-image.yml

permissions:
  contents: read

concurrency:
  group: downstream-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./downstream/validate
  publish:
    # Only this repository's trusted branches may receive a package-write token.
    # Pull requests (including same-repository PRs) never enter this job.
    if: >-
      github.repository == 'yooztech/OmniRoute' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/downstream/patch-build')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate and smoke-test publication candidate
        id: candidate
        uses: ./downstream/validate
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push only the smoke-tested local image tags
        shell: bash
        env:
          IMAGE_METADATA: ${{ steps.candidate.outputs.metadata-file }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker push "$tag"
          done < <(node -e 'for (const tag of JSON.parse(require("fs").readFileSync(process.env.IMAGE_METADATA, "utf8")).tags) console.log(tag)')
      - name: Retain the successfully pushed image addresses
        uses: actions/upload-artifact@v4
        with:
          name: downstream-publication
          path: ${{ steps.candidate.outputs.metadata-file }}
          if-no-files-found: error
          retention-days: 30
