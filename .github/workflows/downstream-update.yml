name: Downstream upstream update PR

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read

concurrency:
  group: downstream-upstream-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'yooztech/OmniRoute'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Resolve latest stable upstream release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node downstream/update-upstream.mjs > "$RUNNER_TEMP/downstream-update.json"
          node -e 'const fs = require("fs"); const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/downstream-update.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${result.changed}\n`);'
      - name: Fully validate updated candidate before proposing
        if: steps.release.outputs.changed == 'true'
        uses: ./downstream/validate
      - name: Propose pinned upstream update
        if: steps.release.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: downstream/update-upstream
          add-paths: downstream/config.json
          commit-message: 'chore(downstream): update pinned upstream release'
          title: 'chore(downstream): update pinned upstream release'
          body: |
            Updates only the downstream upstream release tag and resolved commit; resets the downstream revision to 1.

            The upgrade job passed downstream tooling tests, candidate npm ci and npm run test:coverage, and a local amd64 build with the container's actual HEALTHCHECK before creating this PR. Review the upstream changes before merging. This workflow does not deploy or publish images. Merging into main invokes the separate downstream image workflow.
          labels: ''
